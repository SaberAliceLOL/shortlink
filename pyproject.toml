[project]
name = "shortlink"
version = "0.1.0"
description = "高并发短链服务：业务极简，技术纵深——缓存、压测、可观测性"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # MySQL 8 默认 caching_sha2_password，非 TLS 连接要靠 RSA 加密换密码，
    # 缺 cryptography 时认证直接抛 RuntimeError。注意：aiomysql 0.3 的
    # extra 名是 rsa（不是 cryptography），装 aiomysql[cryptography] 会静默失效——
    # 本地 venv 恰好有残留下来的包才没暴露，容器里一跑就 500。
    # 所以在真正的驱动 PyMySQL 上声明 extra，不依赖上层包转发。
    "pymysql[rsa]>=1.1",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "I", "UP"]  # 生成的迁移代码，不按项目风格管
"app/**" = ["B008"]  # FastAPI 官方惯例就是 Depends() 放默认参数位

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
