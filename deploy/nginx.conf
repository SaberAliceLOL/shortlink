# Nginx：公网唯一入口，反代到 app:8000
#
# 只做三件事：转发、记录访问日志（Week 6 要取真实 IP 做统计）、透传客户端信息。
# 不在 Nginx 层做缓存——缓存策略属于应用层（Week 3 Cache Aside），
# 两处都缓存会让“缓存命中率”这个指标失去意义。

upstream shortlink_app {
    server app:8000;
    # 长连接复用：避免每次请求都三次握手，压测时这项能明显降低 P99
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 长链最长 2048，加 8K 头部余量足够
    client_max_body_size 16k;

    # 访问日志：nginx 官方镜像里 access.log 已软链到 /dev/stdout，
    # 所以这里实际写入容器 stdout，由 Docker 日志驱动收集（compose 里限定了轮转大小）。
    # 用内置 combined 格式（含 referer/user_agent）；XFF 与上游耗时由 Week 7 的
    # 结构化日志在应用侧补全——log_format 指令只能在 http 块定义，这里的文件是 server 块。
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # 透传真实客户端信息：应用侧按 X-Forwarded-For 逐级取第一个非内网 IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 跳转接口：不缓冲，302 立刻返回
    location / {
        proxy_pass http://shortlink_app;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    # 健康检查打 Nginx 自己，不占应用 worker；
    # 端到端检查请打 /health（会转发到 app）
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
