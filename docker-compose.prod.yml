# 生产编排：app + MySQL + Redis + Nginx，一条命令起全栈
#
# 与本地 docker-compose.yml 的区别：
#   1. 只暴露 Nginx 的 80 端口，MySQL/Redis/app 全在内部网络（本地开发才需要直连）
#   2. 所有敏感配置走 .env.prod（不提交），compose 文件本身可公开
#   3. app 有健康检查，Nginx 等 app healthy 再启动，避免启动期 502

name: shortlink-prod

services:
  mysql:
    image: mysql:8.4
    container_name: shortlink-prod-mysql
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 2C1.6G 的小机器：压住 InnoDB 缓冲池，避免 OOM
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    healthcheck:
      # $$ 转义：让变量在容器内展开（env_file 已注入），不依赖 compose 插值
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 700M

  redis:
    image: redis:7.4
    container_name: shortlink-prod-redis
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - redis-data:/data
    # 只监听容器网络可达，不映射宿主机端口；AOF 保证重启不丢缓存键
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 300M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: shortlink-app:latest
    container_name: shortlink-prod-app
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: prod
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 容器内不跑迁移，迁移由部署脚本显式执行（见 scripts/deploy.sh）：
    # 应用启动和 schema 变更解耦，回滚时不会“代码退回但表已改”
    deploy:
      resources:
        limits:
          memory: 400M

  nginx:
    image: nginx:1.27-alpine
    container_name: shortlink-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 日志走 Docker 日志驱动（json-file），限制大小防止 2C 小机器被日志撑爆磁盘；
    # 只挂配置文件，不挂日志卷——nginx 镜像里 access.log 本身软链到 stdout
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  mysql-data:
  redis-data:
